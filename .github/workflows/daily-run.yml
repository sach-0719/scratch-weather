name: 3-Hour Weather Update

on:
  schedule:
    # 🕒 3時間おき（0時、3時、6時、9時…）に実行（UTC時間）
    # ※世界標準時で3で割れる時間は、日本時間（JST）に直しても「ちょうど3で割れる時間」になります。
    - cron: '0 */3 * * *'
  workflow_dispatch: # 手動で今すぐテストするためのボタン

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests scratchattach

    - name: Run script
      # 🔐 GitHubのSecretsに預けた秘密の情報を、Pythonの環境変数として注入します
      env:
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        SCRATCH_USERNAME: ${{ secrets.SCRATCH_USERNAME }}
        SCRATCH_SESSION_ID: ${{ secrets.SCRATCH_SESSION_ID }}
        SCRATCH_PROJECT_ID: ${{ secrets.SCRATCH_PROJECT_ID }} # 👈 この1行を追加して更新！
      run: python script.py
